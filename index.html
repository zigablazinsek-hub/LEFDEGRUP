/* Layout: two panes on wide screens (setlist rail | chord sheet), one pane at a time on phones. */
:root {

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --chord: #91b1ff; --accent: #7f9fff; --accent-fg: #0d1020; --soft: #1e2436;

:root[data-theme="dark"] {
  --bg: #101217; --panel: #171a21; --fg: #e7e9ee; --muted: #9aa1ad; --line: #2a2f39;
  --chord: #91b1ff; --accent: #7f9fff; --accent-fg: #0d1020; --soft: #1e2436;
  --ok: #5fd08f; --warn: #f0b45a; --danger: #ff8a7a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45 }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--fg); margin-bottom: 18px }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: .9; letter-spacing: .01em; text-transform: uppercase }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; letter-spacing: .14em; color: var(--muted); margin-top: 6px }
button, .btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2 }
button:hover, .btn:hover { border-color: var(--muted) }

button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
button.danger { color: var(--danger) }
button.danger.armed { background: var(--danger); color: var(--panel); border-color: var(--danger) }
button:disabled { opacity: .5; cursor: default }
.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 22px; align-items: start }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 40px) }
.search { width: 100%; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg) }
.count { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--line) }
.list li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 10px 6px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-weight: 400 }
.list li button[aria-current="true"] { background: var(--soft) }

.list .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.tools .grp { display: inline-flex; align-items: center; gap: 4px }
.tools .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px }
.tools .val { font-family: var(--f-mono); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums }
.tools .sp { flex: 1 }
.sheet { font-family: var(--f-mono); font-size: var(--sheet-size); line-height: 1.5; white-space: pre; overflow-x: auto; padding-bottom: 6px }

.empty { color: var(--muted); max-width: 60ch }
.empty h2 { font-family: var(--f-display); font-size: 28px; color: var(--fg); text-transform: uppercase; margin: 0 0 8px }

.form { display: grid; gap: 14px }
.form h2 { font-family: var(--f-display); font-size: 32px; text-transform: uppercase; margin: 0 }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: var(--bg) }
.step h3 { margin: 0; font-size: 14px; font-weight: 600 }

input[type=text], input[type=url], input[type=number], textarea { font: inherit; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0 }

.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.msg { font-size: 13px; color: var(--muted) }
.msg.err { color: var(--danger) } .msg.ok { color: var(--ok) }
.banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px }

@media (max-width: 860px) {

@media (prefers-reduced-motion: no-preference) { .list li button { transition: background .12s } }

    render(); window.scrollTo({ top: 0 });
  }
  function backToList() { document.body.classList.remove("reading"); render(); }

  function render() { renderList(); renderPane(); }

  function renderPane() {
    const pane = $("#pane"); pane.replaceChildren();
    const back = el("button", { class: "back", type: "button", onclick: backToList }, "← Seznam");
    if (mode === "new") { pane.append(back, editor(null)); return; }
    const s = songs.find(x => x.id === currentId);
    if (mode === "edit" && s) { pane.append(back, editor(s)); return; }
    if (!s) {
      pane.append(el("div", { class: "empty" }, el("h2", {}, ready ? "Izberi komad" : "Pesmarica se nalaga"),
        el("p", {}, ready ? "Klikni komad na seznamu za akorde in besedilo." : "Seznam komadov se bere iz skupne pesmarice benda.")));
      return;
    }
    const key = transposeKey(s.key, steps);
    const meta = el("div", { class: "meta" },
      s.key ? el("span", {}, "Tonaliteta ", el("b", { class: "key" }, key), steps ? ` (original ${s.key})` : "") : null,
      s.bpm ? el("span", {}, "Tempo ", el("b", {}, String(s.bpm)), " BPM") : null,
      s.capo ? el("span", {}, "Kapodaster ", el("b", {}, String(s.capo))) : null);
    const links = el("div", { class: "links" }, (s.links || []).map(l => el("a", { href: l.url, target: "_blank", rel: "noopener" }, (l.label || hostLabel(l.url)) + " ↗")));
    const del = el("button", { class: "danger", type: "button" }, "Izbriši");
    let armed = null;
    del.addEventListener("click", async () => {
      if (!armed) { del.classList.add("armed"); del.textContent = "Res izbriši?"; armed = setTimeout(() => { armed = null; del.classList.remove("armed"); del.textContent = "Izbriši"; }, 4000); return; }
      clearTimeout(armed); del.disabled = true;
      try { await db.doc("songs/" + s.id).delete(); currentId = null; backToList(); } catch (e) { flash(dbErr(e)); del.disabled = false; }
    });
    const arch = el("button", { type: "button" }, s.archived ? "Vrni na seznam" : "Arhiviraj");
    arch.addEventListener("click", async () => {
      arch.disabled = true;
      try { await db.doc("songs/" + s.id).update({ archived: !s.archived, updatedAt: Date.now() }); showArchive = !s.archived; flash(s.archived ? "Komad je spet na seznamu." : "Komad je v arhivu.", "ok"); }
      catch (e) { flash(dbErr(e)); arch.disabled = false; }
    });
    const stepVal = el("span", { class: "val" }, (steps > 0 ? "+" : "") + steps);
    const sizeVal = el("span", { class: "val" }, size);
    const tools = el("div", { class: "tools" },
      el("span", { class: "grp" }, el("span", { class: "lbl" }, "Transponiraj"),
        el("button", { type: "button", "aria-label": "Pol tona nižje", onclick: () => { steps = (steps - 1) % 12; renderPane(); } }, "−"), stepVal,
        el("button", { type: "button", "aria-label": "Pol tona višje", onclick: () => { steps = (steps + 1) % 12; renderPane(); } }, "+")),
      el("span", { class: "grp" }, el("span", { class: "lbl" }, "Velikost"),
        el("button", { type: "button", "aria-label": "Manjša pisava", onclick: () => setSize(size - 1) }, "A−"), sizeVal,
        el("button", { type: "button", "aria-label": "Večja pisava", onclick: () => setSize(size + 1) }, "A+")),
      el("span", { class: "grp", role: "group", "aria-label": "Prikaz", hidden: true }, el("span", { class: "lbl" }, "Prikaz"),
        [["both", "Oboje"], ["chords", "Akordi"], ["lyrics", "Besedilo"]].map(([v, t]) => el("button", { type: "button", class: view === v ? "primary" : null, "aria-pressed": view === v ? "true" : "false", onclick: () => { view = v; store.set("pes.view", v); renderPane(); } }, t))),
      s.bpm ? metroButton(s.bpm) : null,
      null,
      el("span", { class: "sp" }),
      null);
    pane.append(back, s.archived ? el("div", { class: "archived" }, "V arhivu") : null, el("div", { class: "artist" }, s.artist || ""), el("h1", { class: "title" }, s.title || "Brez naslova"), meta, links,
      s.notes ? el("p", { class: "notes" }, s.notes) : null, tools, sheetView(s, key));
  }

  function sheetView(s, key) {
    const text = transposeSheet(s.sheet || "", steps, s.key);
    if (!text.trim()) return el("div", { class: "empty" }, el("p", {}, "Za ta komad še ni akordov ne besedila."));
    const pre = el("div", { class: "sheet" });
    for (const line of text.split("\n")) {
      if (isSection(line)) pre.append(el("span", { class: "sec" }, line.trim().replace(/^\[|\]$|^\{c:\s*|\}$/g, "")), "\n");
      else if (isChordLine(line)) { if (view !== "lyrics") pre.append(el("span", { class: "ch" }, line), "\n"); }
      else if (view !== "chords" || !line.trim()) pre.append(line + "\n");
    }
    return pre;
  }

  // ---------- Metronome + tap tempo ----------
  let metro = null;
  function stopMetro() { if (metro) { clearInterval(metro.timer); metro.ctx.close().catch(() => {}); metro = null; } }
  function metroButton(bpm) {
    const b = el("button", { type: "button", "aria-pressed": metro ? "true" : "false" }, metro ? "■ Ustavi metronom" : "▶ Metronom " + bpm);
    b.addEventListener("click", () => {
      if (metro) { stopMetro(); renderPane(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = new AC(); let beat = 0;
      const tick = () => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = beat % 4 === 0 ? 1500 : 1000; g.gain.setValueAtTime(0.3, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05); o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.06); beat++; };
      tick(); metro = { ctx, timer: setInterval(tick, 60000 / bpm) }; renderPane();
    });
    return b;
  }
  function tapButton(input) {
    let taps = [];
    return el("button", { type: "button", title: "Tapkaj v ritmu komada", onclick: () => {
      const now = performance.now(); if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
      taps.push(now); if (taps.length > 8) taps.shift();
      if (taps.length >= 3) { const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); input.value = Math.round(60000 / avg); }
    } }, "Tapkaj");
  }

  function setSize(n) { size = Math.max(11, Math.min(26, n)); store.set("pes.size", size); document.documentElement.style.setProperty("--sheet-size", size + "px"); renderPane(); }

  async function saveTransposed(s) {
    try {
      await db.doc("songs/" + s.id).update({ sheet: transposeSheet(s.sheet || "", steps, s.key), key: transposeKey(s.key, steps) || "", updatedAt: Date.now() });
      steps = 0; flash("Shranjeno v novi tonaliteti.", "ok");
    } catch (e) { flash(dbErr(e)); }
  }

  // ---------- Editor (new + edit) ----------
  function editor(s) {
    const isNew = !s; const v = s || {};
    const f = (id, label, val, type = "text", extra = {}) => el("label", { for: id }, label, el("input", { id, type, value: val ?? "", ...extra }));
    const linkInput = el("input", { id: "f-link", type: "url", placeholder: "https://tabs.ultimate-guitar.com/tab/…", value: (v.links && v.links[0] && v.links[0].url) || "" });
    const openLink = el("a", { class: "btn", target: "_blank", rel: "noopener", hidden: true }, "Odpri stran ↗");
    const paste = el("textarea", { id: "f-paste", rows: "6", placeholder: "Sem prilepi vsebino strani z akordi" });
    const importMsg = el("span", { class: "msg" });
    const importBtn = el("button", { class: "primary", type: "button" }, "Uredi s Claude");
    const sheet = el("textarea", { id: "f-sheet", spellcheck: "false", placeholder: "[Kitica]\nAm        F        C\nBesedilo pod akordi …" });
    sheet.value = v.sheet || "";
    const syncLink = () => {
      const url = linkInput.value.trim(); const ok = /^https?:\/\//i.test(url);
      openLink.hidden = !ok; if (ok) openLink.href = url;
      if (ok && isNew) { const g = guessFromUrl(url); if (g) { if (!$("#f-title").value && g.title) $("#f-title").value = g.title; if (!$("#f-artist").value && g.artist) $("#f-artist").value = g.artist; } }
    };
    linkInput.addEventListener("input", syncLink);

    let ctl = null;
    importBtn.addEventListener("click", async () => {
      const text = paste.value.trim();
      if (!text) { importMsg.className = "msg err"; importMsg.textContent = "Najprej prilepi vsebino strani v polje zgoraj."; return; }
      if (!sample) { importMsg.className = "msg err"; importMsg.textContent = "Claude na tej strani ni na voljo. Prilepi akorde in besedilo neposredno v spodnje polje."; return; }
      ctl = new AbortController(); importBtn.disabled = true; importMsg.className = "msg"; importMsg.textContent = "Claude ureja vsebino…";
      const prompt = `A band is building its private songbook. The user opened a chords web page and copied its whole text. Extract the one song on it.

Reply with only one JSON object:
{"title": string, "artist": string, "key": string, "capo": number|null, "bpm": number|null, "sheet": string, "error": string|null}

Rules for "sheet":
- Copy the chords and lyrics exactly as they appear in the text. Do not invent, complete or correct anything.
- Put each chord line on its own line directly above its lyric line, keeping the spaces so chords stay above the right syllable.
- Put each section label on its own line in square brackets, translated to Slovenian: [Uvod], [Kitica], [Kitica 2], [Predrefren], [Refren], [Most], [Solo], [Zaključek], [Inštrumental].
- Remove everything that is not the song: site menus, ads, ratings, comments, "views", tuning widgets, strumming diagrams, chord diagrams, buttons.
- Keep repeat marks like (2x).
"key": the key if the page states it, otherwise the first chord's root and quality (e.g. "Am"). "capo": the capo fret if stated, else null.
If the text holds no song, set "error" to a short Slovenian sentence and leave the other fields empty.

Page URL: ${linkInput.value.trim() || "(none)"}

Copied page text:
"""
${text.slice(0, 60000)}
"""`;
      try {
        const r = await sample.json(prompt, { modelTier: "quick", signal: ctl.signal });
        if (!r || typeof r !== "object") throw { code: "invalid_json" };
        if (r.error) { importMsg.className = "msg err"; importMsg.textContent = r.error; return; }
        if (r.title) $("#f-title").value = r.title;
        if (r.artist) $("#f-artist").value = r.artist;
        if (r.key) $("#f-key").value = r.key;
        if (r.capo != null && r.capo !== "") $("#f-capo").value = r.capo;
        if (r.bpm != null && r.bpm !== "") $("#f-bpm").value = r.bpm;
        if (r.sheet) sheet.value = String(r.sheet);
        importMsg.className = "msg ok"; importMsg.textContent = "Urejeno. Preglej spodaj in shrani.";
      } catch (e) {
        importMsg.className = "msg err";
        importMsg.textContent = ({ not_granted: "Dovoljenje za Claude je bilo zavrnjeno. Akorde lahko prilepiš neposredno spodaj.", rate_limited: "Preveč zahtev naenkrat. Poskusi čez minuto.", cancelled: "Prekinjeno.", invalid_json: "Claude ni vrnil uporabnega zapisa. Poskusi znova ali prilepi manj besedila.", prompt_too_large: "Besedila je preveč. Kopiraj samo del z akordi." })[e && e.code] || "Uvoz ni uspel. Poskusi znova.";
      } finally { importBtn.disabled = false; }
    });

    const saveMsg = el("span", { class: "msg" });
    const saveBtn = el("button", { class: "primary", type: "button" }, isNew ? "Shrani na seznam" : "Shrani spremembe");
    saveBtn.addEventListener("click", async () => {
      const title = $("#f-title").value.trim();
      if (!title) { saveMsg.className = "msg err"; saveMsg.textContent = "Vpiši naslov komada."; $("#f-title").focus(); return; }
      if (!db) { saveMsg.className = "msg err"; saveMsg.textContent = "Pesmarica ni povezana, shranjevanje ni mogoče."; return; }
      const url = linkInput.value.trim();
      const links = (v.links || []).slice();
      if (url && /^https?:\/\//i.test(url) && !links.some(l => l.url === url)) links.unshift({ url, label: (guessFromUrl(url) || {}).label || hostLabel(url) });
      const num = id => { const n = parseInt($(id).value, 10); return Number.isFinite(n) ? n : null; };
      const data = { title, artist: $("#f-artist").value.trim(), key: $("#f-key").value.trim(), bpm: num("#f-bpm"), capo: num("#f-capo"),
        notes: $("#f-notes").value.trim(), sheet: sheet.value.replace(/\s+$/, ""), links, updatedAt: Date.now() };
      saveBtn.disabled = true; saveMsg.className = "msg"; saveMsg.textContent = "Shranjujem…";
      try {
        if (isNew) { const ref = await db.collection("songs").add({ ...data, createdAt: Date.now() }); currentId = ref.id; }
        else await db.doc("songs/" + s.id).update(data);
        mode = "view"; steps = 0; store.set("pes.current", currentId); render();
      } catch (e) { saveMsg.className = "msg err"; saveMsg.textContent = dbErr(e); saveBtn.disabled = false; }
    });

    const cancel = el("button", { type: "button", onclick: () => { ctl?.abort(); mode = "view"; if (isNew) document.body.classList.remove("reading"); render(); } }, "Prekliči");
    const form = el("div", { class: "form" },
      el("h2", {}, isNew ? "Nova pesem" : "Uredi pesem"),
      el("div", { class: "step" },
        el("h3", {}, "1. Povezava na stran z akordi"),
        el("p", {}, "Ultimate Guitar, zabrenkaj.si, e-chords, pesmarica.rs ali katerakoli druga. Naslov in izvajalca preberem iz povezave."),
        el("div", { class: "actions" }, el("div", { style: "flex:1;min-width:220px" }, linkInput), openLink)),
      el("div", { class: "step" },
        el("h3", {}, "2. Prilepi vsebino strani"),
        el("p", {}, "Na odprti strani označi vse (Ctrl+A ali ⌘A), kopiraj in prilepi sem. Claude izlušči akorde in besedilo, ostalo zavrže."),
        paste, el("div", { class: "actions" }, importBtn, importMsg)),
      el("div", { class: "row" }, f("f-title", "Naslov", v.title), f("f-artist", "Izvajalec", v.artist)),
      el("div", { class: "row" }, f("f-key", "Tonaliteta", v.key, "text", { placeholder: "npr. Am" }), el("label", { for: "f-bpm" }, "Tempo (BPM)", (() => { const i = el("input", { id: "f-bpm", type: "number", min: "30", max: "300", value: v.bpm ?? "" }); return el("div", { class: "actions", style: "flex-wrap:nowrap" }, i, tapButton(i)); })()), f("f-capo", "Kapodaster", v.capo, "number", { min: "0", max: "12" })),
      el("label", { for: "f-sheet" }, "Akordi in besedilo", sheet),
      el("label", { for: "f-notes" }, "Opombe", el("textarea", { id: "f-notes", rows: "2" }, v.notes || "")),
      el("div", { class: "actions" }, saveBtn, cancel, saveMsg));
    queueMicrotask(syncLink);
    return form;
  }

  function dbErr(e) {
    return ({ not_granted: "Nimaš pravice urejati pesmarice. Lastnik te mora dodati kot urednika.", unavailable: "Povezava s pesmarico je prekinjena. Poskusi znova.", quota_exceeded: "Pesmarica je polna.", invalid_argument: "Zapis je prevelik ali neveljaven." })[e && e.code] || "Shranjevanje ni uspelo. Poskusi znova.";
  }
  function flash(text, kind = "err") { const b = $("#banner"); b.textContent = text; b.style.borderColor = kind === "ok" ? "var(--ok)" : ""; b.style.color = kind === "ok" ? "var(--ok)" : ""; b.hidden = false; setTimeout(() => { b.hidden = true; }, 4000); }

  $("#q").addEventListener("input", renderList);
  $("#tab-active").addEventListener("click", () => { showArchive = false; renderList(); });
  $("#tab-archive").addEventListener("click", () => { showArchive = true; renderList(); });
  

  render();

  songs = sortSongs(EMBED); ready = true; render();
})();
</script>

</body>
</html>
